<!DOCTYPE html>
<html lang="en" data-theme="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1730" id="themeColor">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Katha</title>
<style>
:root{--amber:#f7941d;--sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--serif:'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif}
[data-theme=night]{
  --grad:linear-gradient(180deg,#7d8593 0%,#2b3b58 30%,#13294b 56%,#0c1730 100%);
  --text:#f4f6fb;--mute:#a3b2cc;--pill:rgba(160,184,230,.6);--track:rgba(255,255,255,.26);
  --play:#f6f4f0;--playink:#16315c;--panel:#0f1d36;--field:rgba(255,255,255,.08);--line:rgba(255,255,255,.13);--chip:rgba(255,255,255,.1);--tint:.5
}
[data-theme=day]{
  --grad:linear-gradient(180deg,#c6c5c7 0%,#e2e0df 32%,#f0eeec 100%);
  --text:#25242b;--mute:#6d6b75;--pill:#8f8d97;--track:rgba(0,0,0,.16);
  --play:#4b4a51;--playink:#ffffff;--panel:#f7f6f4;--field:rgba(0,0,0,.05);--line:rgba(0,0,0,.1);--chip:rgba(0,0,0,.07);--tint:.3
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#0c1730;color:var(--text);font-family:var(--sans)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
svg{display:block}
.bg{position:fixed;inset:0;background:var(--grad);z-index:0}
.tint{position:fixed;left:0;right:0;top:0;height:58dvh;background:center/cover no-repeat;transform:scale(1.3);filter:blur(46px) saturate(1.15);opacity:0;z-index:0;
  -webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent);transition:opacity .5s}
.tint.on{opacity:var(--tint)}
main{position:relative;z-index:1;max-width:440px;margin:0 auto;min-height:100dvh;padding:max(10px,env(safe-area-inset-top)) 20px max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column}

/* header */
header{display:flex;align-items:center;gap:8px;height:48px}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--chip);flex:none}
.ib:active{opacity:.7}
.sp{flex:1}
.hello{padding:9px 14px;border-radius:999px;background:var(--chip);font-size:13px;font-weight:600;transition:opacity .3s;white-space:nowrap}
.hello.fade{opacity:0}

/* link bar */
.linkbar{margin:8px 0 4px}
.lb-pill{display:flex;align-items:center;gap:8px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--pill);font-size:13px;font-weight:600;margin:0 auto}
.lb-form{display:flex;gap:8px}
.lb-form input{flex:1;min-width:0;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--text);font-size:16px}
.lb-form input::placeholder{color:var(--mute)}
.lb-go{height:44px;padding:0 18px;border-radius:12px;background:var(--amber);color:#1d1204;font-weight:700}
.linkbar.min .lb-form{display:none}
.linkbar:not(.min) .lb-pill{display:none}
.lb-x.hide{display:none}

/* stage */
.stage{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding-top:6px}
.cover{--h:min(40dvh,76vw);--ar:1;height:var(--h);width:calc(var(--h)*var(--ar));margin:0 auto;border-radius:8px;overflow:hidden;position:relative;background:var(--field);box-shadow:0 16px 38px rgba(0,0,0,.4)}
.cover img{width:100%;height:100%;object-fit:cover;display:none}
.cover.has img{display:block}
.ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:26px;color:var(--mute);font-size:15px;line-height:1.45}
.cover.has .ph{display:none}
.meta{text-align:center;min-height:52px;padding:0 6px}
.meta .t{font-weight:700;font-size:18px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta .a{margin-top:3px;color:var(--mute);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pills{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pill{height:34px;padding:0 14px;border-radius:999px;border:1.5px solid var(--pill);font-size:13px;font-weight:600}
.pill:active{opacity:.7}
.prog{padding:0 2px}
.times{display:flex;justify-content:space-between;color:var(--mute);font-size:12.5px;font-variant-numeric:tabular-nums}
.times #mid{color:var(--text);opacity:.85}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:26px;background:transparent;margin:0;display:block}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(to right,var(--amber) var(--p,0%),var(--track) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--amber);margin-top:-5px;border:0}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:var(--track)}
input[type=range]::-moz-range-progress{height:3px;border-radius:2px;background:var(--amber)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--amber);border:0}
.ctrl{display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.ctrl .sk,.ctrl .tr{width:48px;height:48px;display:grid;place-items:center;border-radius:50%}
.ctrl button:active{opacity:.7}
.big{width:74px;height:74px;border-radius:50%;background:var(--play);color:var(--playink);display:grid;place-items:center}
.big:active{transform:scale(.96)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);margin-top:4px}
.act{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 0;font-size:12px;font-weight:600}
.act .v{height:24px;display:grid;place-items:center;font-size:16px;font-weight:700}
.act.on{color:var(--amber)}
.vid{margin-top:8px;border-radius:10px;overflow:hidden;background:#000;aspect-ratio:16/9}
.vid.off{position:fixed;left:-400px;bottom:0;width:220px;height:220px;aspect-ratio:auto;margin:0}
.vid iframe{width:100%;height:100%;border:0}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;z-index:5}
.scrim.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;left:0;top:0;bottom:0;width:min(90vw,400px);z-index:6;background:var(--panel);transform:translateX(-105%);transition:transform .25s ease;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 0 max(12px,env(safe-area-inset-bottom));box-shadow:8px 0 30px rgba(0,0,0,.35)}
.drawer.open{transform:none}
.dr-h{display:flex;align-items:center;justify-content:space-between;padding:0 16px 8px}
.brand{font:700 22px/1 var(--serif)}
.seg{display:flex;gap:6px;padding:4px 16px 10px}
.seg button{flex:1;height:36px;border-radius:999px;border:1.5px solid var(--pill);font-size:14px;font-weight:600}
.seg button.on{background:var(--amber);border-color:var(--amber);color:#1d1204}
.dr-b{flex:1;overflow:auto;padding:0 16px 16px}
.cnt{font-weight:700;font-size:14px;padding:8px 0 4px}
.empty{color:var(--mute);font-size:14px;text-align:center;padding:30px 10px;line-height:1.5}
.bk{display:flex;align-items:center;gap:6px;padding:10px 0}
.bk.cur .bt{color:var(--amber)}
.bk-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
.th{width:62px;height:62px;border-radius:6px;object-fit:cover;background:var(--field);flex:none}
.bi{min-width:0;flex:1}
.bt{font-weight:700;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ba{font-size:13px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bm{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--mute);margin-top:4px}
.bar{width:64px;height:3px;border-radius:2px;background:var(--track);overflow:hidden;flex:none}
.bar i{display:block;height:100%;background:var(--amber)}
.pl{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--pill);display:grid;place-items:center;flex:none}
.bk .ib{background:none;width:34px}
.stabs{display:flex;gap:6px;margin:6px 0 14px;flex-wrap:wrap}
.stabs button{height:34px;padding:0 14px;border-radius:8px;border:1.5px solid var(--pill);font-size:13px;font-weight:600}
.stabs button.on{border-color:#6fa0ff;background:rgba(111,160,255,.18)}
.slabel{text-align:center;font-size:11.5px;letter-spacing:.06em;color:var(--mute);font-weight:700;text-transform:uppercase}
.sdate{text-align:center;font-weight:700;font-size:17px;margin-top:2px}
.bigt{display:flex;justify-content:center;gap:26px;margin:22px 0 10px;text-align:center}
.bigt b{display:block;font-size:38px;line-height:1.1}
.bigt span{font-size:13px;color:var(--mute)}
.avg{text-align:center;font-weight:800;font-size:28px;margin:6px 0 2px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fact{background:var(--field);border-radius:12px;padding:12px;text-align:center}
.fact b{display:block;font-size:22px}
.fact span{font-size:12.5px;color:var(--mute)}
.note{color:var(--mute);font-size:12.5px;text-align:center;margin-top:10px;line-height:1.45}

.sheet{position:fixed;left:0;right:0;bottom:0;z-index:6;max-width:440px;margin:0 auto;max-height:88dvh;overflow:auto;background:var(--panel);border-radius:20px 20px 0 0;padding:16px 18px max(22px,env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s ease;box-shadow:0 -10px 40px rgba(0,0,0,.35)}
.sheet.open{transform:none}
.sh-h{font-weight:800;font-size:18px;margin-bottom:12px;line-height:1.3}
.dcov{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.dc{width:112px;height:112px;border-radius:8px;overflow:hidden;background:var(--field);flex:none}
.dc img{width:100%;height:100%;object-fit:cover}
.dbtns{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.fl{display:block;font-size:12.5px;color:var(--mute);font-weight:600;margin-bottom:10px}
.fl input{display:block;width:100%;height:46px;margin-top:5px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--field);color:var(--text);font-size:16px;font-weight:500}
.primary{width:100%;height:50px;border-radius:14px;background:var(--amber);color:#1d1204;font-weight:800;font-size:16px;margin-top:6px}
.ghost{width:100%;height:44px;color:var(--mute);font-weight:600;margin-top:2px}
.opt{display:block;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line);font-weight:600}
.opt.danger{color:#ff6b6b;border:0}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.row .go{flex:1;text-align:left}
.row .tt{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
.row .ss{font-size:12px;color:var(--mute);margin-top:2px}
.x{width:36px;height:36px;color:var(--mute);font-size:22px;line-height:1}
.add{width:100%;height:44px;border-radius:12px;border:1.5px dashed var(--amber);color:var(--amber);font-weight:700;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);background:#2d2639;color:#f4f1f8;border:1px solid rgba(255,255,255,.14);padding:10px 16px;border-radius:12px;font-size:14px;max-width:88vw;opacity:0;pointer-events:none;transition:.25s;z-index:9;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bg"></div>
<div class="tint" id="tint"></div>

<main>
  <header>
    <button class="ib" id="menuBtn" aria-label="Open library">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
    <div class="sp"></div>
    <button class="ib" id="themeBtn" aria-label="Switch day and night view"></button>
    <div class="hello" id="hello">Welcome, JK</div>
  </header>

  <div class="linkbar" id="linkbar">
    <button class="lb-pill" id="lbOpen">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>
      Add a YouTube link
    </button>
    <div class="lb-form">
      <input id="link" type="url" inputmode="url" placeholder="Paste a YouTube link" aria-label="YouTube link">
      <button class="lb-go" id="go">Add</button>
      <button class="ib lb-x" id="lbClose" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
  </div>

  <section class="stage">
    <div class="cover" id="cover">
      <img id="art" alt="Cover">
      <div class="ph">Paste a YouTube audiobook link to start listening</div>
    </div>

    <div class="meta">
      <div class="t" id="title"></div>
      <div class="a" id="author"></div>
    </div>

    <div class="pills">
      <button class="pill" id="pClips">Clips</button>
      <button class="pill" id="pDetails">Title details</button>
      <button class="pill" id="pLog">Listen log</button>
    </div>

    <div class="prog">
      <input type="range" id="seek" min="0" max="100" step="1" value="0" aria-label="Seek">
      <div class="times"><span id="cur">0:00</span><span id="mid"></span><span id="rem"></span></div>
    </div>

    <div class="ctrl">
      <button class="tr" id="prev" aria-label="Previous clip">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M5 5h2v14H5zM19 5v14L8 12z"/></svg>
      </button>
      <button class="sk" id="back" aria-label="Back 15 seconds">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4v5h5"/><path d="M3.5 13a9 9 0 1 0 2.6-6.4L3 9"/><text x="12" y="15.4" font-size="7.5" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">15</text></svg>
      </button>
      <button class="big" id="pp" aria-label="Play">
        <svg id="ico" width="36" height="36" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      </button>
      <button class="sk" id="fwd" aria-label="Forward 15 seconds">
        <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4v5h-5"/><path d="M20.5 13a9 9 0 1 1-2.6-6.4L21 9"/><text x="12" y="15.4" font-size="7.5" font-weight="700" text-anchor="middle" fill="currentColor" stroke="none">15</text></svg>
      </button>
      <button class="tr" id="next" aria-label="Next clip">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M17 5h2v14h-2zM5 5v14l11-7z"/></svg>
      </button>
    </div>

    <div class="acts">
      <button class="act" id="speed"><span class="v" id="speedv">1×</span>Speed</button>
      <button class="act" id="sleep"><span class="v"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13.5" r="7"/><path d="M12 10v4l2.5 1.5M9.5 3h5M12 3v3.5"/></svg></span><span id="sleepl">Timer</span></button>
      <button class="act" id="clip"><span class="v"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/><path d="M12 7.5v5M9.5 10h5"/></svg></span>+ Clip</button>
      <button class="act" id="vtog"><span class="v"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="2"/><path d="M16 10l5-3v10l-5-3z"/></svg></span>Video</button>
    </div>

    <div class="vid off" id="vid"><div id="yt"></div></div>
  </section>
</main>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-label="Library"></aside>
<div class="sheet" id="sheet" role="dialog"></div>
<input type="file" id="file" accept="image/*" hidden>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const store = {
  get(k, d){ try { const v = JSON.parse(localStorage.getItem(k)); return v === null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } }
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = s => {
  s = Math.max(0, Math.floor(s || 0));
  const h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h + ':' + String(m).padStart(2,'0') : m) + ':' + String(x).padStart(2,'0');
};
const leftFmt = s => { const m = Math.max(0, Math.round(s/60)), h = Math.floor(m/60); return h ? `${h}h ${m%60}m left` : `${m}m left`; };
const short = s => s < 3600 ? Math.round(s/60) + 'm' : (s/3600).toFixed(1).replace('.0','') + 'h';
const dkey = d => { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
const thumbHi = id => `https://i.ytimg.com/vi/${id}/maxresdefault.jpg`;
const thumbLo = id => `https://i.ytimg.com/vi/${id}/mqdefault.jpg`;

function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('on'), 3400);
}

/* ---------- saved data ---------- */
const getLib = () => store.get('katha.lib', {});
const setLib = l => store.set('katha.lib', l);
const getCover = id => { try { return localStorage.getItem('katha.cover.' + id); } catch(e){ return null; } };
const setCover = (id, d) => { try { localStorage.setItem('katha.cover.' + id, d); return true; } catch(e){ toast('Storage is full, so the cover was not saved.'); return false; } };
const delCover = id => { try { localStorage.removeItem('katha.cover.' + id); } catch(e){} };
const bmKey = id => 'katha.clips.' + id;
let stats = store.get('katha.stats', {});

/* ---------- state ---------- */
let yt = null, ready = false, pending = null, vid = null;
let playing = false, wantPlay = false, dragging = false, hiddenAt = 0, lastSave = 0, listenStart = 0;
let rate = store.get('katha.rate', 1);
const rates = [0.75, 1, 1.25, 1.5, 1.75, 2];
if (rates.indexOf(rate) < 0) rate = 1;
let draft = null, dTab = 'lib', sTab = 'today';

/* ---------- icons ---------- */
const I = {
  playS:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>',
  pauseS:'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>',
  dots:'<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>',
  x:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  sun:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/></svg>',
  moon:'<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>'
};

/* ---------- theme + greeting ---------- */
function themeNow(){
  const t = store.get('katha.theme', null);
  if (t) return t;
  const h = new Date().getHours();
  return (h >= 19 || h < 6) ? 'night' : 'day';
}
function applyTheme(){

/* ---------- silent audio keeps the page "playing" for the OS / lock screen ---------- */
let keep = null;
function silentWav(){
  const sr = 8000, n = sr, b = new ArrayBuffer(44 + n), d = new DataView(b);
  const w = (o, s) => [...s].forEach((c, i) => d.setUint8(o + i, c.charCodeAt(0)));
  w(0,'RIFF'); d.setUint32(4, 36 + n, true); w(8,'WAVEfmt '); d.setUint32(16,16,true);
  d.setUint16(20,1,true); d.setUint16(22,1,true); d.setUint32(24,sr,true); d.setUint32(28,sr,true);
  d.setUint16(32,1,true); d.setUint16(34,8,true); w(36,'data'); d.setUint32(40,n,true);
  new Uint8Array(b, 44).fill(128);
  return URL.createObjectURL(new Blob([b], {type:'audio/wav'}));
}
function keepOn(){ try { if (!keep){ keep = new Audio(silentWav()); keep.loop = true; } keep.play().catch(() => {}); } catch(e){} }
function keepOff(){ try { keep && keep.pause(); } catch(e){} }

/* ---------- YouTube player ---------- */
window.onYouTubeIframeAPIReady = () => {
  const vars = {playsinline:1, rel:0, modestbranding:1, controls:1};
  if (location.protocol.indexOf('http') === 0) vars.origin = location.origin;
  yt = new YT.Player('yt', {
    width:'100%', height:'100%', playerVars: vars,
    events: {
      onReady: () => { ready = true; if (pending){ const p = pending; pending = null; loadBook(p.id, p.autoplay); } },
      onStateChange: onState,
      onError: onErr
    }
  });
};
const errs = {
  2:"That link doesn't look right.",
  5:"This video can't play in an embedded player.",
  100:"Video not found, or it's private.",
  101:"The owner doesn't allow this video outside YouTube.",
  150:"The owner doesn't allow this video outside YouTube.",
  153:"YouTube won't play from a file opened directly. Host this file (GitHub Pages / Netlify) or open it through a local server."
};
function onErr(e){ toast(errs[e.data] || 'Could not play this video.'); setPlaying(false); stopListen(); }

function parseLink(s){
  s = (s || '').trim();
  if (/^[\w-]{11}$/.test(s)) return {v:s, t:0};
  let u;
  try { u = new URL(/^https?:\/\//i.test(s) ? s : 'https://' + s); } catch(e){ return null; }
  let v = u.searchParams.get('v');
  if (!v){
    const m = u.pathname.match(/^\/(?:shorts|embed|live|v)\/([\w-]{11})/);
    if (m) v = m[1];
  }
  if (!v && u.hostname === 'youtu.be') v = u.pathname.slice(1, 12);
  const t = parseInt(u.searchParams.get('t')) || 0;
  if (v && /^[\w-]{11}$/.test(v)) return {v, t};
  return null;
}

function playerVid(){ try { const d = yt.getVideoData(); return d && d.video_id; } catch(e){ return null; } }

function loadBook(id, autoplay){
  const lib = getLib(), b = lib[id];
  if (!b) return;
  vid = id; store.set('katha.last', id);
  renderBook();
  if (!ready){ pending = {id, autoplay}; if (autoplay) toast('Loading player…'); return; }
  let from = b.pos || 0;
  if (b.dur && b.dur - from < 15) from = 0;
  if (autoplay){
    wantPlay = true; keepOn(); touch(id);
    yt.loadVideoById({videoId:id, startSeconds:from});
  } else {
    wantPlay = false;
    yt.cueVideoById({videoId:id, startSeconds:from});
  }
  try { yt.setPlaybackRate(rate); } catch(e){}
}
function touch(id){ const l = getLib(); if (l[id]){ l[id].t = Date.now(); setLib(l); } }

function onState(e){
  const S = YT.PlayerState;
  if (e.data === S.PLAYING){
    setPlaying(true); refreshMeta();
    try { yt.setPlaybackRate(rate); } catch(x){}
    if (!listenStart) listenStart = Date.now();
  } else if (e.data === S.PAUSED || e.data === S.CUED || e.data === S.UNSTARTED){
    setPlaying(false); stopListen(); save();
    if (e.data === S.CUED) refreshMeta();
  } else if (e.data === S.ENDED){
    wantPlay = false; setPlaying(false); stopListen(); keepOff();
    const l = getLib(); if (l[vid]){ l[vid].pos = l[vid].dur || l[vid].pos; setLib(l); }
    renderDrawerIfOpen();
  }
}

/* fill in blanks from YouTube without overwriting anything the user edited */
function refreshMeta(){
  let d; try { d = yt.getVideoData(); } catch(e){ return; }
  if (!d || !d.video_id || d.video_id !== vid) return;
  const lib = getLib(), b = lib[vid];
  if (!b) return;
  let ch = false;
  if (!b.title && d.title){ b.title = d.title; ch = true; }
  if (!b.author && d.author){ b.author = d.author; ch = true; }
  const dur = yt.getDuration() || 0;
  if (dur && b.dur !== dur){ b.dur = dur; ch = true; }
  if (ch){ setLib(lib); renderBook(); renderDrawerIfOpen(); }
}

/* ---------- render the current book ---------- */
function renderBook(){
  const b = getLib()[vid];
  const cover = $('#cover');
  if (!b){
    cover.classList.remove('has'); $('#title').textContent = ''; $('#author').textContent = '';
    $('#tint').classList.remove('on'); paint(0, 0); return;
  }
  const custom = getCover(vid), art = $('#art');
  art.onload = () => {
    const ar = Math.min(1, Math.max(.62, art.naturalWidth / art.naturalHeight));
    cover.style.setProperty('--ar', ar);
  };
  art.onerror = () => { art.onerror = null; art.src = thumbLo(vid); };
  art.src = custom || thumbHi(vid);
  cover.classList.add('has');
  $('#tint').style.backgroundImage = `url("${custom || thumbLo(vid)}")`;
  $('#tint').classList.add('on');
  $('#title').textContent = b.title || 'Untitled';
  $('#author').textContent = b.author || '';
  document.title = b.title || 'Katha';
  if (!playing) paint(b.pos || 0, b.dur || 0);
  setSession();
}

function paint(t, d){
  if (dragging) return;
  seek.max = d || 100; seek.value = t;
  seek.style.setProperty('--p', (d ? t / d * 100 : 0) + '%');
  $('#cur').textContent = fmt(t);
  $('#mid').textContent = d ? leftFmt((d - t) / rate) + ` (${rate}×)` : '';
  $('#rem').textContent = d ? '-' + fmt(d - t) : '';
}

/* ---------- controls ---------- */
function setPlaying(p){
  playing = p;
  $('#ico').innerHTML = p ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  $('#pp').setAttribute('aria-label', p ? 'Pause' : 'Play');
  if ('mediaSession' in navigator) navigator.mediaSession.playbackState = p ? 'playing' : 'paused';
  renderDrawerIfOpen();
}
function play(){
  if (!vid){ toast('Paste a YouTube link to begin.'); openBar(); return; }
  if (!ready){ pending = {id:vid, autoplay:true}; toast('Loading player…'); return; }
  wantPlay = true; keepOn();
  if (playerVid() !== vid){ loadBook(vid, true); return; }
  touch(vid); yt.playVideo();
}
function pause(){ if (!ready) return; wantPlay = false; yt.pauseVideo(); keepOff(); stopListen(); save(); }
function toggle(){ if (!ready || !vid){ play(); return; } yt.getPlayerState() === 1 ? pause() : play(); }
function seekTo(t){
  if (!ready || !vid) return;
  t = Math.max(0, t); yt.seekTo(t, true);
  const d = yt.getDuration() || +seek.max || 0;
  paint(t, d);
  const l = getLib(); if (l[vid]){ l[vid].pos = t; if (d > 100) l[vid].dur = d; setLib(l); }
}
function skip(s){
  if (!ready || !vid) return;
  const d = yt.getDuration() || 0;
  seekTo(Math.min(d ? d - 1 : 1e9, (yt.getCurrentTime() || 0) + s));
}
$('#pp').onclick = toggle;
$('#back').onclick = () => skip(-15);
$('#fwd').onclick = () => skip(15);
$('#prev').onclick = () => jumpClip(-1);
$('#next').onclick = () => jumpClip(1);

const seek = $('#seek');
seek.addEventListener('input', () => {
  dragging = true;
  const d = +seek.max || 1, t = +seek.value;
  seek.style.setProperty('--p', (t / d * 100) + '%');
  $('#cur').textContent = fmt(t);
  $('#mid').textContent = leftFmt((d - t) / rate) + ` (${rate}×)`;
  $('#rem').textContent = '-' + fmt(d - t);
});
seek.addEventListener('change', () => { dragging = false; seekTo(+seek.value); });

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space'){ e.preventDefault(); toggle(); }
  if (e.code === 'ArrowLeft') skip(-15);

});

/* ---------- progress loop + listening time ---------- */
function flushListen(){
  if (!listenStart) return;
  const now = Date.now();
  const s = Math.min(300, (now - listenStart) / 1000);
  listenStart = now;
  if (s > 0){ const k = dkey(); stats[k] = (stats[k] || 0) + s; }
}
function stopListen(){ flushListen(); listenStart = 0; }

function update(){
  if (!ready || !vid) return;
  let t = 0, d = 0;
  try { t = yt.getCurrentTime() || 0; d = yt.getDuration() || 0; } catch(e){ return; }
  if (playing && d) paint(t, d);
  if (playing){ flushListen(); if (Date.now() - lastSave > 5000) save(); }
  if (sleepEnd) sleepLabel();
  if ('mediaSession' in navigator && navigator.mediaSession.setPositionState && d){
    try { navigator.mediaSession.setPositionState({duration:d, playbackRate:rate, position:Math.min(t, d)}); } catch(e){}
  }
}
setInterval(update, 500);

function save(){
  lastSave = Date.now();
  store.set('katha.stats', stats);
  if (!ready || !vid) return;
  let t = 0, d = 0;
  try { t = yt.getCurrentTime() || 0; d = yt.getDuration() || 0; } catch(e){ return; }
  let st = -1; try { st = yt.getPlayerState(); } catch(e){}
  const lib = getLib(), b = lib[vid];
  if (!b || !(d > 0) || playerVid() !== vid || (st !== 1 && st !== 2)) return;
  b.pos = t; b.dur = d;
  setLib(lib);
}
window.addEventListener('pagehide', () => { stopListen(); save(); });

/* ---------- add / edit details ---------- */
async function fetchMeta(id){
  const u = 'https://www.youtube.com/watch?v=' + id;
  const tries = ['https://www.youtube.com/oembed?format=json&url=' + encodeURIComponent(u),
                 'https://noembed.com/embed?url=' + encodeURIComponent(u)];
  for (const url of tries){
    try {
      const ctl = new AbortController(), to = setTimeout(() => ctl.abort(), 4500);
      const r = await fetch(url, {signal:ctl.signal}); clearTimeout(to);
      if (!r.ok) continue;
      const j = await r.json();
      if (j && j.title) return {title:j.title, author:j.author_name || ''};
    } catch(e){}
  }
  return null;
}

function beginAdd(raw){
  const p = parseLink(raw);
  if (!p){ toast("That doesn't look like a YouTube video link."); return; }
  const b = getLib()[p.v];
  draft = {mode:'add', id:p.v, t:p.t, cover:getCover(p.v) || null, isNew:!b};
  renderDetails(b || {title:'', author:''});
  if (!b){
    fetchMeta(p.v).then(m => {
      if (!draft || draft.id !== p.v) return;
      const ti = $('#fTitle'), au = $('#fAuthor');
      if (!ti) return;
      ti.placeholder = 'Title'; au.placeholder = 'Author';
      if (m){ if (!ti.value) ti.value = m.title; if (!au.value) au.value = m.author; }
    });
  }
}
function editBook(id){
  const b = getLib()[id]; if (!b) return;
  draft = {mode:'edit', id, cover:getCover(id) || null, isNew:false};
  renderDetails(b);
}

function renderDetails(b){
  const d = draft;
  closeDrawer();
  $('#sheet').innerHTML = `
    <div class="sh-h">${d.mode === 'add' ? 'Add audiobook' : 'Title details'}</div>
    <div class="dcov">
      <div class="dc"><img id="dimg" alt="Cover"></div>
      <div class="dbtns">
        <button class="pill" data-act="pick">Choose from Photos</button>
        <button class="pill" data-act="ytcover">Use YouTube cover</button>
      </div>
    </div>
    <label class="fl">Title<input id="fTitle" value="${esc(b.title)}" placeholder="${d.isNew ? 'Getting title from YouTube…' : 'Title'}" autocomplete="off"></label>
    <label class="fl">Author<input id="fAuthor" value="${esc(b.author)}" placeholder="${d.isNew ? 'Getting author…' : 'Author'}" autocomplete="off"></label>
    <button class="primary" data-act="submit">${d.mode === 'add' ? 'Start listening' : 'Save'}</button>
    <button class="ghost" data-act="cancel">Cancel</button>`;
  setDetCover();
  showSheet();
}
function setDetCover(){
  const img = $('#dimg'); if (!img || !draft) return;
  img.onerror = () => { img.onerror = null; img.src = thumbLo(draft.id); };
  img.src = draft.cover || thumbHi(draft.id);
}
function readCover(file){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => {
      const img = new Image();
      img.onload = () => {
        const s = Math.min(1, 640 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', .86));
      };
      img.onerror = rej; img.src = r.result;
    };
    r.onerror = rej; r.readAsDataURL(file);
  });
}
$('#file').addEventListener('change', async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f || !draft) return;
  try { draft.cover = await readCover(f); setDetCover(); } catch(err){ toast("Couldn't read that photo."); }
});

function submitDetails(){
  if (!draft) return;
  const d = draft, lib = getLib();
  const b = lib[d.id] || {id:d.id, pos:0, dur:0, t:Date.now()};
  b.title = $('#fTitle').value.trim();
  b.author = $('#fAuthor').value.trim();
  if (d.mode === 'add' && d.t) b.pos = d.t;
  lib[d.id] = b; setLib(lib);
  if (d.cover) setCover(d.id, d.cover); else delCover(d.id);
  const mode = d.mode, id = d.id;
  closeSheet(); draft = null;
  if (mode === 'add'){ minBar(); loadBook(id, true); }
  else { if (id === vid) renderBook(); renderDrawerIfOpen(); toast('Saved'); }
}

/* ---------- clips (bookmarks) ---------- */
const getClips = () => vid ? store.get(bmKey(vid), []) : [];
function addClip(){
  if (!ready || !vid){ toast('Start a book first.'); return; }
  const t = Math.floor(yt.getCurrentTime() || 0), l = getClips();
  l.push({t}); l.sort((a, b) => a.t - b.t); store.set(bmKey(vid), l);
  toast('Clip saved at ' + fmt(t));
  if ($('#sheet').dataset.view === 'clips') renderClips();
}
function jumpClip(dir){
  if (!ready || !vid) return;
  const l = getClips(); if (!l.length){ toast('No clips yet. Tap + Clip to save a spot.'); return; }
  const t = yt.getCurrentTime() || 0;
  if (dir > 0){ const n = l.find(c => c.t > t + 1); n ? seekTo(n.t) : toast('No later clips.'); }
  else { const p = [...l].reverse().find(c => c.t < t - 3); p ? seekTo(p.t) : seekTo(0); }
}
function renderClips(){
  const l = getClips();
  let h = `<div class="sh-h">Clips</div><button class="add" data-act="addclip">+ Clip at ${fmt(ready && vid ? yt.getCurrentTime() : 0)}</button>`;
  if (!l.length) h += `<div class="empty">No clips for this book yet.</div>`;
  l.forEach((c, i) => { h += `<div class="row"><button class="go" data-act="jump" data-t="${c.t}"><div class="tt">${fmt(c.t)}</div><div class="ss">Tap to jump here</div></button><button class="x" data-act="delclip" data-i="${i}" aria-label="Delete clip">×</button></div>`; });
  $('#sheet').innerHTML = h; $('#sheet').dataset.view = 'clips'; showSheet();
}
$('#clip').onclick = addClip;
$('#pClips').onclick = () => { if (!vid){ toast('Start a book first.'); return; } closeDrawer(); renderClips(); };
$('#pDetails').onclick = () => { if (!vid){ toast('Start a book first.'); return; } editBook(vid); };
$('#pLog').onclick = () => { dTab = 'stats'; openDrawer(); };

/* ---------- sheet + drawer plumbing ---------- */
function showSheet(){ $('#sheet').classList.add('open'); $('#scrim').classList.add('open'); }
function closeSheet(){ $('#sheet').classList.remove('open'); $('#sheet').dataset.view = ''; if (!$('#drawer').classList.contains('open')) $('#scrim').classList.remove('open'); }
function openDrawer(){ closeSheet(); renderDrawer(); $('#drawer').classList.add('open'); $('#scrim').classList.add('open'); }
function closeDrawer(){ $('#drawer').classList.remove('open'); if (!$('#sheet').classList.contains('open')) $('#scrim').classList.remove('open'); }
$('#scrim').onclick = () => { if ($('#sheet').classList.contains('open')){ closeSheet(); draft = null; } else closeDrawer(); };
$('#menuBtn').onclick = () => { dTab = 'lib'; openDrawer(); };
function renderDrawerIfOpen(){ if ($('#drawer').classList.contains('open')) renderDrawer(); }

$('#sheet').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'pick') $('#file').click();
  if (a === 'ytcover'){ if (draft){ draft.cover = null; setDetCover(); } }
  if (a === 'submit') submitDetails();
  if (a === 'cancel'){ closeSheet(); draft = null; }
  if (a === 'addclip'){ addClip(); renderClips(); }
  if (a === 'jump'){ seekTo(+b.dataset.t); if (!playing) play(); closeSheet(); }
  if (a === 'delclip'){ const l = getClips(); l.splice(+b.dataset.i, 1); store.set(bmKey(vid), l); renderClips(); }
  if (a === 'edit'){ editBook(b.dataset.id); }
  if (a === 'remove'){ b.dataset.act = 'remove2'; b.textContent = 'Tap again to remove for good'; }
  else if (a === 'remove2'){ removeBook(b.dataset.id); }
});

function removeBook(id){
  const lib = getLib(); delete lib[id]; setLib(lib);
  delCover(id); try { localStorage.removeItem(bmKey(id)); } catch(e){}
  closeSheet();
  if (id === vid){
    if (ready){ try { yt.stopVideo(); } catch(e){} }
    wantPlay = false; keepOff(); setPlaying(false); stopListen();
    const next = Object.values(lib).sort((a, b) => b.t - a.t)[0];
    vid = null;
    if (next) loadBook(next.id, false); else { store.set('katha.last', null); renderBook(); openBar(); }
  }
  renderDrawerIfOpen();
}

/* ---------- drawer: library + listening time ---------- */
function renderDrawer(){
  let h = `<div class="dr-h"><span class="brand">Katha</span><button class="ib" data-act="closeD" aria-label="Close">${I.x}</button></div>
    <div class="seg"><button data-dt="lib" class="${dTab === 'lib' ? 'on' : ''}">Library</button><button data-dt="stats" class="${dTab === 'stats' ? 'on' : ''}">Listening</button></div>
    <div class="dr-b">${dTab === 'lib' ? libHTML() : statsHTML()}</div>`;

}
function libHTML(){
  const items = Object.values(getLib()).sort((a, b) => b.t - a.t);
  if (!items.length) return `<div class="empty">Books you add will show up here, with your place saved.</div>`;
  let h = `<div class="cnt">${items.length} title${items.length > 1 ? 's' : ''}</div>`;
  items.forEach(b => {
    const pct = b.dur ? Math.min(100, (b.pos || 0) / b.dur * 100) : 0;
    const left = !b.dur ? 'Not started' : (b.dur - (b.pos || 0) < 15 ? 'Finished' : leftFmt((b.dur - b.pos) / rate));
    const cur = b.id === vid, pl = cur && playing, id = esc(b.id);
    h += `<div class="bk ${cur ? 'cur' : ''}">
      <button class="bk-main" data-act="open" data-id="${id}"><img class="th" src="${esc(getCover(b.id) || thumbLo(b.id))}" alt="">
        <div class="bi"><div class="bt">${esc(b.title || 'Untitled')}</div>${b.author ? `<div class="ba">By ${esc(b.author)}</div>` : ''}
        <div class="bm"><span class="bar"><i style="width:${pct}%"></i></span>${left}</div></div></button>
      <button class="pl" data-act="rowplay" data-id="${id}" aria-label="${pl ? 'Pause' : 'Play'}">${pl ? I.pauseS : I.playS}</button>
      <button class="ib" data-act="menu" data-id="${id}" aria-label="More">${I.dots}</button></div>`;
  });
  return h;
}

function computeStats(){
  const keys = Object.keys(stats).filter(k => stats[k] > 0).sort();
  const total = keys.reduce((a, k) => a + stats[k], 0);
  const now = new Date(), today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const S = {total, today:stats[dkey()] || 0, daysListened:keys.length, books:Object.keys(getLib()).length};
  let firstDate = today0;
  if (keys.length){ const [y, m, d] = keys[0].split('-').map(Number); firstDate = new Date(y, m - 1, d); }
  const days = Math.max(1, Math.round((today0 - firstDate) / 864e5) + 1);
  S.dailyAvg = total / days;
  S.last7 = [];
  for (let i = 6; i >= 0; i--){
    const d = new Date(today0); d.setDate(d.getDate() - i);
    S.last7.push({label:'SMTWTFS'[d.getDay()], val:stats[dkey(d)] || 0, now:i === 0});
  }
  const byMonth = {};
  keys.forEach(k => { const mk = k.slice(0, 7); byMonth[mk] = (byMonth[mk] || 0) + stats[k]; });
  const months = [];
  let y = firstDate.getFullYear(), m = firstDate.getMonth();
  while (y < now.getFullYear() || (y === now.getFullYear() && m <= now.getMonth())){
    months.push({y, m, val:byMonth[y + '-' + String(m + 1).padStart(2, '0')] || 0});
    m++; if (m > 11){ m = 0; y++; }
  }
  S.monthlyAvg = total / Math.max(1, months.length);
  S.months = months.slice(-6).map(o => ({label:new Date(o.y, o.m, 1).toLocaleString('en', {month:'short'}), val:o.val, now:o.y === now.getFullYear() && o.m === now.getMonth()}));
  S.range = S.months.length > 1 ? S.months[0].label + ' – ' + S.months[S.months.length - 1].label + ' ' + now.getFullYear() : now.toLocaleString('en', {month:'long', year:'numeric'});
  return S;
}
function chart(items, avg){
  const W = 320, H = 176, pad = 22, base = H - 26, top = 16;
  const max = Math.max(60, ...items.map(i => i.val), avg) * 1.18;
  const step = (W - 2 * pad) / items.length, bw = Math.min(34, step * .6);
  let g = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Listening chart">`;
  items.forEach((it, i) => {
    const h = (base - top) * it.val / max, x = pad + step * i + (step - bw) / 2;
    g += `<rect x="${x}" y="${base - h}" width="${bw}" height="${Math.max(h, it.val > 0 ? 3 : 0)}" rx="4" fill="${it.now ? '#6fa0ff' : '#8fb4ff'}" opacity="${it.now ? 1 : .7}"/>`;
    if (it.val > 0) g += `<text x="${x + bw / 2}" y="${base - h - 5}" text-anchor="middle" font-size="10" fill="currentColor">${short(it.val)}</text>`;
    g += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--mute)">${it.label}</text>`;
  });
  const ay = base - (base - top) * avg / max;
  g += `<line x1="${pad - 10}" x2="${W - pad + 10}" y1="${base}" y2="${base}" stroke="var(--line)"/>`;
  g += `<line x1="${pad - 10}" x2="${W - pad + 10}" y1="${ay}" y2="${ay}" stroke="currentColor" stroke-width="1.6" stroke-dasharray="1.5 5" stroke-linecap="round" opacity=".75"/></svg>`;
  return g;
}
function statsHTML(){
  const S = computeStats();
  const hm = s => { const m = Math.round(s / 60); return {h:Math.floor(m / 60), m:m % 60}; };
  const big = s => { const t = hm(s); return `<div class="bigt"><div><b>${t.h}</b><span>Hours</span></div><div><b>${t.m}</b><span>Minutes</span></div></div>`; };
  const nice = s => { const t = hm(s); return t.h ? `${t.h}h ${t.m}m` : `${t.m}m`; };
  const tabs = [['today', 'Today'], ['daily', 'Daily'], ['monthly', 'Monthly'], ['total', 'Total']];
  let h = `<div class="stabs">${tabs.map(([k, l]) => `<button data-st="${k}" class="${sTab === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  if (sTab === 'today'){
    h += `<div class="slabel">Today</div><div class="sdate">${new Date().toLocaleDateString('en', {month:'long', day:'numeric', year:'numeric'})}</div>${big(S.today)}`;
    h += `<div class="note">Time you actually spent listening, so 1 hour at 1.5× counts as 1 hour.</div>`;
  } else if (sTab === 'daily'){
    h += `<div class="slabel">Daily average</div><div class="avg">${nice(S.dailyAvg)}</div><div class="slabel">Since you started</div>${chart(S.last7, S.dailyAvg)}<div class="note">Last 7 days. The dotted line is your daily average.</div>`;
  } else if (sTab === 'monthly'){
    h += `<div class="slabel">Monthly average</div><div class="avg">${nice(S.monthlyAvg)}</div><div class="slabel">${S.range}</div>${chart(S.months, S.monthlyAvg)}<div class="note">The dotted line is your monthly average.</div>`;
  } else {
    h += `<div class="slabel">Total listening time</div>${big(S.total)}<div class="facts"><div class="fact"><b>${S.daysListened}</b><span>days listened</span></div><div class="fact"><b>${S.books}</b><span>books in library</span></div></div>`;
  }
  return h;
}

$('#drawer').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.dt){ dTab = b.dataset.dt; renderDrawer(); return; }
  if (b.dataset.st){ sTab = b.dataset.st; renderDrawer(); return; }
  const a = b.dataset.act, id = b.dataset.id;
  if (a === 'closeD') closeDrawer();
  if (a === 'open'){ closeDrawer(); if (id !== vid) loadBook(id, false); }
  if (a === 'rowplay'){
    if (id === vid) toggle(); else { closeDrawer(); loadBook(id, true); }
  }
  if (a === 'menu'){
    const bk = getLib()[id]; if (!bk) return;
    closeDrawer();
    $('#sheet').innerHTML = `<div class="sh-h">${esc(bk.title || 'Untitled')}</div>
      <button class="opt" data-act="edit" data-id="${esc(id)}">Edit title, author and cover</button>
      <button class="opt danger" data-act="remove" data-id="${esc(id)}">Remove from library</button>`;
    showSheet();
  }
});

/* ---------- lock screen / notification controls ---------- */
function setSession(){
  if (!('mediaSession' in navigator) || !vid) return;
  const b = getLib()[vid]; if (!b) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title:b.title || 'Untitled', artist:b.author || '', album:'Katha',
      artwork:[{src:getCover(vid) || thumbLo(vid), sizes:'320x180', type:'image/jpeg'}]
    });
  } catch(e){}
}
if ('mediaSession' in navigator){
  const h = (n, f) => { try { navigator.mediaSession.setActionHandler(n, f); } catch(e){} };
  h('play', play); h('pause', pause);
  h('seekbackward', () => skip(-15)); h('seekforward', () => skip(15));
  h('seekto', d => seekTo(d.seekTime));
}

/* if the phone pauses the embed when the screen locks, try to nudge it back on */
document.addEventListener('visibilitychange', () => {
  if (document.hidden){
    hiddenAt = Date.now();
    setTimeout(() => { if (wantPlay && ready && yt.getPlayerState() === 2 && Date.now() - hiddenAt < 4000) yt.playVideo(); }, 700);
  } else {
    save();
    if (wantPlay && ready && yt.getPlayerState() === 2) yt.playVideo();
  }
});

/* ---------- boot: open on the last book ---------- */
(function boot(){
  applyTheme();
  const lib = getLib(), last = store.get('katha.last', null);
  const ids = Object.keys(lib).sort((a, b) => lib[b].t - lib[a].t);
  const id = lib[last] ? last : ids[0];
  if (id){ vid = id; renderBook(); $('#linkbar').classList.add('min'); pending = {id, autoplay:false}; }
  else { renderBook(); }
  $('#lbClose').classList.toggle('hide', !id);
  const s = document.createElement('script');
  s.src = 'https://www.youtube.com/iframe_api';
  s.onerror = () => toast('Could not reach YouTube. Check your internet connection.');
  document.head.appendChild(s);
  setTimeout(() => { if (!ready) toast("YouTube player didn't load. If you're in a preview, open this file in Safari/Koder or host it."); }, 7000);
})();
</script>
